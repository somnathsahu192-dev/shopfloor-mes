<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>SHOPFLOOR — Daily Job Board</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5A623">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#14171A;
    --surface:#1D2126;
    --surface-2:#262B31;
    --surface-3:#2F353C;
    --line:#383F47;
    --amber:#F5A623;
    --amber-dark:#8A5D10;
    --blue:#4E9BD6;
    --green:#3FA34D;
    --green-dark:#1F5128;
    --gray:#6B7280;
    --red:#E5484D;
    --text:#F2F3F1;
    --text-muted:#9AA1A9;
    --text-dim:#6B7280;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,select,textarea{font-family:inherit;}

  /* Topbar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:12px;height:12px;border-radius:2px;background:var(--amber);
    box-shadow:0 0 8px var(--amber);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .brand-text{font-size:19px;font-weight:600;letter-spacing:0.08em;}
  .brand-sub{font-size:11px;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;font-family:'Inter',sans-serif;}
  .home-btn{
    background:transparent;color:var(--text-muted);font-size:12px;
    text-transform:uppercase;letter-spacing:0.05em;padding:8px 12px;
    border:1px solid var(--line);border-radius:var(--radius);
  }
  .home-btn:active{background:var(--surface-3);}

  .wrap{max-width:920px;margin:0 auto;padding:16px;padding-bottom:60px;}

  /* Role select */
  .role-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:40px;}
  @media(min-width:640px){.role-grid{grid-template-columns:1fr 1fr;}}
  .role-card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:28px 22px;text-align:left;display:flex;flex-direction:column;gap:10px;
    transition:border-color .15s, transform .1s;
  }
  .role-card:active{transform:scale(0.98);}
  .role-card.admin{border-top:3px solid var(--blue);}
  .role-card.operator{border-top:3px solid var(--amber);}
  .role-icon{font-size:26px;}
  .role-title{font-size:20px;font-weight:600;}
  .role-desc{font-size:13px;color:var(--text-muted);font-family:'Inter';line-height:1.5;text-transform:none;letter-spacing:normal;}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin:18px 0;border-bottom:1px solid var(--line);}
  .tab{
    background:transparent;color:var(--text-muted);padding:10px 4px;
    font-size:13px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;
    border-bottom:2px solid transparent;margin-right:18px;
  }
  .tab.active{color:var(--amber);border-bottom-color:var(--amber);}

  .section-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin:22px 0 10px;font-weight:600;}

  /* Date row */
  .date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .date-row input[type=date]{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:9px 10px;border-radius:var(--radius);font-size:14px;
  }

  /* Machine block (planning form) */
  .machine-block{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    margin-bottom:14px;overflow:hidden;
  }
  .machine-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
  }
  .machine-name{font-family:'Oswald';font-size:15px;letter-spacing:0.04em;text-transform:uppercase;}
  .job-count-chip{font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono';}
  .job-rows{padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
  .job-input-row{display:flex;gap:8px;align-items:center;}
  .job-input-row input[type=text]{
    flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:9px 10px;border-radius:var(--radius);font-size:14px;min-width:0;
  }
  .job-input-row input[type=number]{
    width:64px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:9px 8px;border-radius:var(--radius);font-size:14px;
  }
  .lock-badge{
    font-size:10px;padding:4px 7px;border-radius:20px;white-space:nowrap;
    text-transform:uppercase;letter-spacing:0.03em;font-weight:600;
  }
  .lock-badge.pending{background:var(--surface-3);color:var(--text-muted);}
  .lock-badge.in-progress{background:var(--amber-dark);color:var(--amber);}
  .lock-badge.complete{background:var(--green-dark);color:#8FE0A0;}
  .row-remove{
    background:transparent;color:var(--text-dim);font-size:18px;padding:4px 8px;border-radius:4px;line-height:1;
  }
  .row-remove:active{background:var(--surface-3);color:var(--red);}
  .add-job-btn{
    margin:4px 14px 12px;background:transparent;border:1px dashed var(--line);color:var(--text-muted);
    padding:9px;border-radius:var(--radius);font-size:13px;text-align:center;
  }
  .add-job-btn:active{border-color:var(--amber);color:var(--amber);}

  .save-plan-btn{
    width:100%;background:var(--amber);color:#1A1200;font-weight:700;
    padding:15px;border-radius:var(--radius);font-size:14px;text-transform:uppercase;
    letter-spacing:0.06em;margin-top:6px;
  }
  .save-plan-btn:active{background:#d99418;}
  .save-note{text-align:center;font-size:12px;color:var(--text-muted);margin-top:8px;min-height:16px;}

  /* Export buttons */
  .export-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .export-btn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:11px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;
    flex:1;min-width:160px;
  }
  .export-btn:active{background:var(--surface-3);border-color:var(--green);}

  /* Andon board */
  .andon-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:560px){.andon-grid{grid-template-columns:1fr 1fr;}}
  .andon-card{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;
    border-left:4px solid var(--gray);
  }
  .andon-card.state-pending{border-left-color:var(--gray);}
  .andon-card.state-progress{border-left-color:var(--amber);}
  .andon-card.state-complete{border-left-color:var(--green);}
  .andon-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .andon-name{font-family:'Oswald';font-size:15px;letter-spacing:0.03em;text-transform:uppercase;}
  .andon-light{width:10px;height:10px;border-radius:50%;}
  .andon-light.state-pending{background:var(--gray);}
  .andon-light.state-progress{background:var(--amber);box-shadow:0 0 6px var(--amber);}
  .andon-light.state-complete{background:var(--green);box-shadow:0 0 6px var(--green);}
  .progress-bar-track{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-bottom:10px;}
  .progress-bar-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s;}
  .andon-count{font-size:12px;color:var(--text-muted);font-family:'JetBrains Mono';margin-bottom:10px;}
  .andon-joblist{display:flex;flex-direction:column;gap:6px;}
  .andon-job{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:var(--surface-2);padding:8px 10px;border-radius:5px;font-size:13px;
  }
  .andon-job-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .andon-job-meta{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono';}
  .update-history{display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid var(--line);}
  .update-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;}
  .update-op{color:var(--text);font-weight:600;}
  .update-shift{color:var(--text-muted);font-family:'JetBrains Mono';}
  .update-time{color:var(--text-dim);font-family:'JetBrains Mono';margin-left:auto;}
  .status-pill{font-size:10px;padding:4px 8px;border-radius:20px;text-transform:uppercase;font-weight:700;letter-spacing:0.03em;white-space:nowrap;}
  .status-pill.pending{background:var(--surface-3);color:var(--text-muted);}
  .status-pill.in-progress{background:var(--amber-dark);color:var(--amber);}
  .status-pill.complete{background:var(--green-dark);color:#8FE0A0;}
  .empty-note{color:var(--text-dim);font-size:13px;text-align:center;padding:30px 10px;font-family:'Inter';}

  /* Operators manage */
  .op-add-row{display:flex;gap:8px;margin-bottom:14px;}
  .op-add-row input{
    flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:11px 12px;border-radius:var(--radius);font-size:14px;
  }
  .op-add-row button{
    background:var(--blue);color:#08202F;font-weight:700;padding:0 18px;border-radius:var(--radius);font-size:13px;text-transform:uppercase;letter-spacing:0.04em;
  }
  .op-list{display:flex;flex-direction:column;gap:8px;}
  .op-item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface);border:1px solid var(--line);padding:11px 14px;border-radius:var(--radius);font-size:14px;
  }
  .op-remove{background:transparent;color:var(--text-dim);font-size:17px;}
  .op-remove:active{color:var(--red);}

  /* Operator setup */
  .setup-card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:22px;margin-top:24px;display:flex;flex-direction:column;gap:16px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;}
  .field select,.field input{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:12px;border-radius:var(--radius);font-size:15px;
  }
  .shift-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .shift-btn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text-muted);
    padding:14px 6px;border-radius:var(--radius);font-size:15px;font-weight:700;text-align:center;
  }
  .shift-btn.active{background:var(--amber-dark);border-color:var(--amber);color:var(--amber);}
  .start-btn{
    background:var(--amber);color:#1A1200;font-weight:700;padding:15px;border-radius:var(--radius);
    font-size:14px;text-transform:uppercase;letter-spacing:0.06em;
  }
  .start-btn:disabled{background:var(--surface-3);color:var(--text-dim);}

  /* Operator job board */
  .op-header-bar{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;margin-bottom:16px;
  }
  .op-header-name{font-size:15px;font-weight:700;}
  .op-header-shift{font-size:12px;color:var(--amber);font-family:'JetBrains Mono';}
  .switch-link{background:transparent;color:var(--text-muted);font-size:12px;text-decoration:underline;}

  .op-job-card{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:14px;margin-bottom:12px;
  }
  .op-job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
  .op-job-title{font-size:15px;font-weight:600;line-height:1.3;}
  .op-job-qty{font-size:12px;color:var(--text-muted);font-family:'JetBrains Mono';margin-bottom:12px;}
  .op-job-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .op-action-btn{
    padding:13px 6px;border-radius:var(--radius);font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.03em;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text-muted);
  }
  .op-action-btn.progress-choice.selected{background:var(--amber-dark);border-color:var(--amber);color:var(--amber);}
  .op-action-btn.complete-choice.selected{background:var(--green-dark);border-color:var(--green);color:#8FE0A0;}
  .op-updated-tag{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono';margin-top:8px;}

  .my-updates-box{
    margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;
  }
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--surface-3);border:1px solid var(--line);color:var(--text);
    padding:10px 18px;border-radius:30px;font-size:13px;z-index:50;
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <div>
      <div class="brand-text">SHOPFLOOR</div>
      <div class="brand-sub" id="topbarSub">Daily Job Board</div>
    </div>
  </div>
  <button class="home-btn" id="homeBtn" style="display:none;">Home</button>
</div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Constants ---------- */
const MACHINES = ["Lathe 1","Lathe 3","Boring Machine","Drilling Machine","Gear Box Section"];
const SHIFTS = ["A","B","C"];

/* ---------- State ---------- */
let state = {
  role: null,        // 'admin' | 'operator'
  adminTab: 'planning', // 'planning' | 'board' | 'operators'
  planDate: todayStr(),
  boardDate: todayStr(),
  plan: null,         // current loaded plan object for planDate
  operators: [],
  opSetupDone: false,
  opName: '',
  opShift: '',
  opDate: todayStr(),
  opPlan: null
};

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function nowStamp(){
  const d = new Date();
  return d.toLocaleString('en-IN', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- Firebase / Firestore setup ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDY0p29HHPg5Hf22h5KNfe7cNsFPr2igrQ",
  authDomain: "workshop-production-plan.firebaseapp.com",
  projectId: "workshop-production-plan",
  storageBucket: "workshop-production-plan.firebasestorage.app",
  messagingSenderId: "299118010121",
  appId: "1:299118010121:web:2c822bfc2761357454fdd8",
  measurementId: "G-M6V2GB390R"
};

let db = null;
let storageBackend = 'unknown'; // 'firestore' | 'memory'
window.__memStore = window.__memStore || {};

try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  storageBackend = 'firestore';
}catch(e){
  console.error('Firebase init failed', e);
  storageBackend = 'memory';
}

async function loadOperators(){
  if(db){
    try{
      const snap = await db.collection('meta').doc('operators').get();
      state.operators = snap.exists ? (snap.data().names || []) : [];
      maybeShowStorageWarning();
      return;
    }catch(e){
      console.error('loadOperators failed', e);
      showToast('Operators load fail: ' + (e.message||e));
    }
  }
  const v = window.__memStore['operators'];
  state.operators = v ? JSON.parse(v) : [];
  storageBackend = 'memory';
  maybeShowStorageWarning();
}
async function saveOperators(){
  if(db){
    try{
      await db.collection('meta').doc('operators').set({names: state.operators});
      return;
    }catch(e){
      console.error('saveOperators failed', e);
      showToast('Save fail: ' + (e.message||e));
      return;
    }
  }
  window.__memStore['operators'] = JSON.stringify(state.operators);
}
async function loadPlan(date){
  if(db){
    try{
      const snap = await db.collection('planning').doc(date).get();
      return snap.exists ? snap.data() : null;
    }catch(e){
      console.error('loadPlan failed', e);
      showToast('Plan load fail: ' + (e.message||e));
      return null;
    }
  }
  const v = window.__memStore['planning:'+date];
  return v ? JSON.parse(v) : null;
}
async function savePlanObj(planObj){
  if(db){
    try{
      await db.collection('planning').doc(planObj.date).set(planObj);
      return {ok:true};
    }catch(e){
      console.error('savePlanObj failed', e);
      return {ok:false, err: (e && e.message) ? e.message : String(e)};
    }
  }
  window.__memStore['planning:'+planObj.date] = JSON.stringify(planObj);
  return {ok:true};
}
function maybeShowStorageWarning(){
  const sub = document.getElementById('topbarSub');
  if(storageBackend === 'memory' && sub){
    sub.innerHTML = '<span style="color:#F5A623;">⚠ Offline mode — data save nahi rahega</span>';
  }
}
function emptyPlan(date){
  const machines = {};
  MACHINES.forEach(m => machines[m] = []);
  return { date, machines, savedAt: null };
}

/* ---------- Toast ---------- */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- Render root ---------- */
function setHome(visible){
  document.getElementById('homeBtn').style.display = visible ? 'inline-block' : 'none';
}
document.getElementById('homeBtn').onclick = () => {
  state.role = null; state.opSetupDone = false;
  render();
};

async function render(){
  const app = document.getElementById('app');
  const sub = document.getElementById('topbarSub');
  if(!state.role){
    setHome(false);
    sub.textContent = 'Daily Job Board';
    app.innerHTML = roleSelectView();
    document.getElementById('goAdmin').onclick = async () => {
      state.role='admin'; await loadOperators();
      if(!state.plan || state.plan.date !== state.planDate) state.plan = await loadPlan(state.planDate) || emptyPlan(state.planDate);
      render();
    };
    document.getElementById('goOperator').onclick = async () => {
      state.role='operator'; await loadOperators();
      render();
    };
    return;
  }
  setHome(true);
  if(state.role==='admin'){
    sub.textContent = 'Admin / Planning';
    app.innerHTML = await adminView();
    wireAdmin();
  } else {
    sub.textContent = 'Operator';
    app.innerHTML = await operatorView();
    wireOperator();
  }
  maybeShowStorageWarning();
}

/* ---------- Role Select ---------- */
function roleSelectView(){
  return `
  <div class="role-grid">
    <button class="role-card admin" id="goAdmin">
      <div class="role-icon">🗂️</div>
      <div class="role-title">Planning / Admin</div>
      <div class="role-desc">Mechanical Head ya Engineer — roz ki planning daalein aur sabhi machines ka live status dekhein.</div>
    </button>
    <button class="role-card operator" id="goOperator">
      <div class="role-icon">⚙️</div>
      <div class="role-title">Operator (Shop Floor)</div>
      <div class="role-desc">Apna naam aur shift select karke aaj ke jobs ka status update karein.</div>
    </button>
  </div>`;
}

/* ================= ADMIN ================= */
async function adminView(){
  let body = '';
  if(state.adminTab==='planning'){
    if(!state.plan || state.plan.date !== state.planDate){
      state.plan = await loadPlan(state.planDate) || emptyPlan(state.planDate);
    }
    body = planningTabHTML();
  } else if(state.adminTab==='board'){
    state.boardPlan = await loadPlan(state.boardDate) || emptyPlan(state.boardDate);
    body = boardTabHTML();
  } else {
    body = operatorsTabHTML();
  }
  return `
    <div class="tabs">
      <button class="tab ${state.adminTab==='planning'?'active':''}" data-tab="planning">Planning Entry</button>
      <button class="tab ${state.adminTab==='board'?'active':''}" data-tab="board">Live Board</button>
      <button class="tab ${state.adminTab==='operators'?'active':''}" data-tab="operators">Operators</button>
    </div>
    ${body}
  `;
}

function planningTabHTML(){
  const p = state.plan;
  let machinesHTML = MACHINES.map(m => {
    const jobs = p.machines[m] || [];
    const rows = jobs.map(j => jobInputRow(m, j)).join('');
    return `
      <div class="machine-block">
        <div class="machine-head">
          <div class="machine-name">${m}</div>
          <div class="job-count-chip">${jobs.length} JOB${jobs.length!==1?'S':''}</div>
        </div>
        <div class="job-rows" data-machine="${m}">${rows}</div>
        <button class="add-job-btn" data-add-machine="${m}">+ Job add karein</button>
      </div>`;
  }).join('');

  return `
    <div class="section-label">Date</div>
    <div class="date-row">
      <input type="date" id="planDateInput" value="${state.planDate}">
    </div>
    <div class="section-label" style="margin-top:20px;">Aaj ki Planning — 5 Departments</div>
    ${machinesHTML}
    <button class="save-plan-btn" id="savePlanBtn">Planning Save Karein</button>
    <div class="save-note" id="saveNote">${p.savedAt ? 'Last saved: '+p.savedAt : 'Abhi tak save nahi hui'}</div>
  `;
}

function jobInputRow(machine, j){
  const locked = j.status !== 'pending';
  return `
    <div class="job-input-row" data-job-id="${j.id}" data-machine="${machine}">
      <input type="text" placeholder="Job / Part naam" value="${escapeAttr(j.job)}" data-field="job" ${locked?'disabled':''}>
      <input type="number" min="0" placeholder="Qty" value="${j.qty ?? ''}" data-field="qty" ${locked?'disabled':''}>
      ${locked ? `<span class="lock-badge ${j.status}">${statusLabel(j.status)}</span>` : ''}
      <button class="row-remove" data-remove-job="${j.id}" data-remove-machine="${machine}">×</button>
    </div>`;
}
function statusLabel(s){
  if(s==='complete') return 'Complete';
  if(s==='in-progress') return 'Progress';
  return 'Pending';
}
function escapeAttr(s){
  return (s||'').replace(/"/g,'&quot;');
}

function boardTabHTML(){
  const p = state.boardPlan;
  const cards = MACHINES.map(m => {
    const jobs = p.machines[m] || [];
    const total = jobs.length;
    const done = jobs.filter(j=>j.status==='complete').length;
    const inProg = jobs.filter(j=>j.status==='in-progress').length;
    let cardState = 'pending';
    if(total>0 && done===total) cardState='complete';
    else if(inProg>0 || done>0) cardState='progress';
    const pct = total ? Math.round((done/total)*100) : 0;
    const jobsHTML = total ? jobs.map(j => {
      const updates = j.updates || [];
      const historyHTML = updates.length ? `
          <div class="update-history">
            ${updates.map(u => `
              <div class="update-line">
                <span class="update-op">${escapeHtml(u.operator)}</span>
                <span class="update-shift">Shift ${escapeHtml(u.shift)}</span>
                <span class="status-pill ${u.action}" style="font-size:9px;padding:2px 6px;">${statusLabel(u.action)}</span>
                <span class="update-time">${escapeHtml(u.ts)}</span>
              </div>`).join('')}
          </div>` : '';
      return `
        <div class="andon-job" style="flex-direction:column;align-items:stretch;gap:6px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div style="flex:1;min-width:0;">
              <div class="andon-job-name">${escapeHtml(j.job || '(no name)')} ${j.qty?`<span class="andon-job-meta">×${j.qty}</span>`:''}</div>
            </div>
            <span class="status-pill ${j.status}">${statusLabel(j.status)}</span>
          </div>
          ${historyHTML}
        </div>`;
    }).join('') : `<div class="empty-note" style="padding:10px 0;">Koi job planned nahi</div>`;
    return `
      <div class="andon-card state-${cardState}">
        <div class="andon-top">
          <div class="andon-name">${m}</div>
          <div class="andon-light state-${cardState}"></div>
        </div>
        <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
        <div class="andon-count">${done}/${total} complete ${inProg?`· ${inProg} in progress`:''}</div>
        <div class="andon-joblist">${jobsHTML}</div>
      </div>`;
  }).join('');

  return `
    <div class="section-label">Date</div>
    <div class="date-row"><input type="date" id="boardDateInput" value="${state.boardDate}"></div>
    <div class="export-row">
      <button class="export-btn" id="exportDayBtn">📥 Is Date Ka Excel Download</button>
      <button class="export-btn" id="exportAllBtn">📥 Sab Dates Ka Excel Download</button>
    </div>
    <div class="section-label" style="margin-top:20px;">Live Status — Sabhi Departments</div>
    <div class="andon-grid">${cards}</div>
  `;
}

function operatorsTabHTML(){
  const list = state.operators.map(name => `
    <div class="op-item">
      <span>${escapeHtml(name)}</span>
      <button class="op-remove" data-remove-op="${escapeAttr(name)}">×</button>
    </div>`).join('') || `<div class="empty-note">Koi operator add nahi hua abhi tak</div>`;
  return `
    <div class="section-label">Naya Operator Add Karein</div>
    <div class="op-add-row">
      <input type="text" id="newOpInput" placeholder="Operator ka naam">
      <button id="addOpBtn">Add</button>
    </div>
    <div class="section-label">Operator List</div>
    <div class="op-list">${list}</div>
  `;
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- Excel (CSV) Export ---------- */
const CSV_HEADERS = ['Date','Machine','Job','Qty','Status','Operator','Shift','Last Update'];
function csvEscape(v){
  const s = (v===undefined||v===null) ? '' : String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function planToRows(plan){
  const rows = [];
  MACHINES.forEach(m => {
    const jobs = (plan.machines && plan.machines[m]) || [];
    jobs.forEach(j => {
      const updates = j.updates || [];
      if(updates.length === 0){
        rows.push([plan.date, m, j.job || '', j.qty ?? '', statusLabel('pending'), '', '', '']);
      } else {
        updates.forEach(u => {
          rows.push([plan.date, m, j.job || '', j.qty ?? '', statusLabel(u.action), u.operator || '', u.shift || '', u.ts || '']);
        });
      }
    });
  });
  return rows;
}
function rowsToCSV(rows){
  const lines = [CSV_HEADERS.join(',')];
  rows.forEach(r => lines.push(r.map(csvEscape).join(',')));
  return '\uFEFF' + lines.join('\n'); // BOM so Excel reads Hindi/UTF-8 text correctly
}
function downloadCSV(filename, csvContent){
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function exportSingleDay(date){
  const plan = await loadPlan(date) || emptyPlan(date);
  const rows = planToRows(plan);
  if(rows.length===0){ showToast('Is date ka koi data nahi hai'); return; }
  downloadCSV(`shopfloor-${date}.csv`, rowsToCSV(rows));
  showToast('Excel download ho gaya ✓');
}
async function exportAllDays(){
  if(!db){ showToast('Firestore connect nahi hai'); return; }
  try{
    const snap = await db.collection('planning').get();
    let allRows = [];
    snap.forEach(doc => { allRows = allRows.concat(planToRows(doc.data())); });
    if(allRows.length===0){ showToast('Koi data nahi mila'); return; }
    allRows.sort((a,b) => a[0]<b[0] ? -1 : a[0]>b[0] ? 1 : 0);
    downloadCSV(`shopfloor-all-data.csv`, rowsToCSV(allRows));
    showToast('Sab data ka Excel download ho gaya ✓');
  }catch(e){
    console.error('exportAllDays failed', e);
    showToast('Export fail: ' + (e.message||e));
  }
}

function wireAdmin(){
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { state.adminTab = t.dataset.tab; render(); };
  });

  if(state.adminTab==='planning'){
    document.getElementById('planDateInput').onchange = async (e) => {
      state.planDate = e.target.value;
      state.plan = await loadPlan(state.planDate) || emptyPlan(state.planDate);
      render();
    };
    document.querySelectorAll('[data-add-machine]').forEach(btn => {
      btn.onclick = () => {
        const m = btn.dataset.addMachine;
        state.plan.machines[m].push({id: uid(), job:'', qty:'', status:'pending', operator:'', shift:'', updatedAt:'', updates:[]});
        render();
      };
    });
    document.querySelectorAll('[data-remove-job]').forEach(btn => {
      btn.onclick = () => {
        const m = btn.dataset.removeMachine, id = btn.dataset.removeJob;
        const job = state.plan.machines[m].find(j=>j.id===id);
        if(job && job.status!=='pending'){
          if(!confirm('Is job ka status already update ho chuka hai. Delete karein?')) return;
        }
        state.plan.machines[m] = state.plan.machines[m].filter(j=>j.id!==id);
        render();
      };
    });
    document.querySelectorAll('.job-input-row').forEach(row => {
      const m = row.dataset.machine, id = row.dataset.jobId;
      row.querySelectorAll('input').forEach(inp => {
        inp.oninput = () => {
          const job = state.plan.machines[m].find(j=>j.id===id);
          if(!job) return;
          if(inp.dataset.field==='job') job.job = inp.value;
          if(inp.dataset.field==='qty') job.qty = inp.value;
        };
      });
    });
    document.getElementById('savePlanBtn').onclick = async () => {
      state.plan.savedAt = nowStamp();
      const r = await savePlanObj(state.plan);
      document.getElementById('saveNote').textContent = r.ok ? 'Last saved: '+state.plan.savedAt : 'Save fail: '+r.err;
      if(r.ok) showToast('Planning save ho gayi ✓');
      else showToast('Save fail: ' + r.err);
    };
  }

  if(state.adminTab==='board'){
    document.getElementById('boardDateInput').onchange = (e) => {
      state.boardDate = e.target.value; render();
    };
    document.getElementById('exportDayBtn').onclick = () => exportSingleDay(state.boardDate);
    document.getElementById('exportAllBtn').onclick = () => exportAllDays();
  }

  if(state.adminTab==='operators'){
    document.getElementById('addOpBtn').onclick = async () => {
      const inp = document.getElementById('newOpInput');
      const name = inp.value.trim();
      if(!name) return;
      if(state.operators.includes(name)){ showToast('Ye naam pehle se hai'); return; }
      state.operators.push(name);
      await saveOperators();
      render();
    };
    document.querySelectorAll('[data-remove-op]').forEach(btn => {
      btn.onclick = async () => {
        state.operators = state.operators.filter(n => n !== btn.dataset.removeOp);
        await saveOperators();
        render();
      };
    });
  }
}

/* ================= OPERATOR ================= */
async function operatorView(){
  if(!state.opSetupDone){
    return operatorSetupHTML();
  }
  state.opPlan = await loadPlan(state.opDate) || emptyPlan(state.opDate);
  return operatorJobsHTML();
}

function operatorSetupHTML(){
  const opts = state.operators.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  return `
    <div class="setup-card">
      <div class="field">
        <label>Apna naam select karein</label>
        <select id="opNameSelect">
          <option value="">— Naam chunein —</option>
          ${opts}
        </select>
        ${state.operators.length===0 ? '<div class="empty-note">Koi operator list mein nahi hai. Admin se add karwayein.</div>' : ''}
      </div>
      <div class="field">
        <label>Shift</label>
        <div class="shift-grid">
          ${SHIFTS.map(s=>`<button class="shift-btn" data-shift="${s}">Shift ${s}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="opDateInput" value="${state.opDate}">
      </div>
      <button class="start-btn" id="opStartBtn" disabled>Jobs Dekhein</button>
    </div>
  `;
}

function wireOperator(){
  if(!state.opSetupDone){
    let chosenShift = state.opShift;
    document.querySelectorAll('.shift-btn').forEach(b => {
      if(b.dataset.shift === chosenShift) b.classList.add('active');
      b.onclick = () => {
        document.querySelectorAll('.shift-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        chosenShift = b.dataset.shift;
        checkStart();
      };
    });
    const nameSelect = document.getElementById('opNameSelect');
    nameSelect.value = state.opName || '';
    nameSelect.onchange = checkStart;
    document.getElementById('opDateInput').onchange = checkStart;

    function checkStart(){
      const ok = nameSelect.value && chosenShift;
      document.getElementById('opStartBtn').disabled = !ok;
    }
    checkStart();

    document.getElementById('opStartBtn').onclick = () => {
      state.opName = nameSelect.value;
      state.opShift = chosenShift;
      state.opDate = document.getElementById('opDateInput').value;
      state.opSetupDone = true;
      render();
    };
    return;
  }

  document.getElementById('opSwitchBtn').onclick = () => {
    state.opSetupDone = false; render();
  };

  document.querySelectorAll('[data-action-job]').forEach(btn => {
    btn.onclick = async () => {
      const m = btn.dataset.machine, id = btn.dataset.actionJob, action = btn.dataset.action;
      const job = state.opPlan.machines[m].find(j=>j.id===id);
      if(!job) return;
      if(!job.updates) job.updates = [];
      job.updates.push({operator: state.opName, shift: state.opShift, action, ts: nowStamp()});
      job.status = action;
      job.operator = state.opName;
      job.shift = state.opShift;
      job.updatedAt = nowStamp();
      const r = await savePlanObj(state.opPlan);
      if(r.ok) showToast('Status update ho gaya ✓');
      else showToast('Save fail: ' + r.err);
      render();
    };
  });
}

function operatorJobsHTML(){
  const p = state.opPlan;
  let allJobsHTML = '';
  let myUpdates = [];
  MACHINES.forEach(m => {
    const jobs = p.machines[m] || [];
    if(jobs.length===0) return;
    allJobsHTML += `<div class="section-label">${m}</div>`;
    jobs.forEach(j => {
      const myLatest = (j.updates||[]).filter(u=>u.operator===state.opName).slice(-1)[0];
      if(myLatest) myUpdates.push({...myLatest, machine:m, jobName:j.job});
      allJobsHTML += `
        <div class="op-job-card">
          <div class="op-job-top">
            <div class="op-job-title">${escapeHtml(j.job || '(job naam nahi hai)')}</div>
          </div>
          <div class="op-job-qty">${j.qty ? 'Qty: '+escapeHtml(String(j.qty)) : ''} ${j.status!=='pending' && j.operator ? '· '+escapeHtml(j.operator)+' (Shift '+j.shift+')' : ''}</div>
          <div class="op-job-btns">
            <button class="op-action-btn progress-choice ${j.status==='in-progress'?'selected':''}" data-action-job="${j.id}" data-machine="${m}" data-action="in-progress">Under Progress</button>
            <button class="op-action-btn complete-choice ${j.status==='complete'?'selected':''}" data-action-job="${j.id}" data-machine="${m}" data-action="complete">Complete</button>
          </div>
          ${j.updatedAt ? `<div class="op-updated-tag">Last update: ${j.updatedAt}</div>` : ''}
        </div>`;
    });
  });
  if(!allJobsHTML){
    allJobsHTML = `<div class="empit-note empty-note">Is date ke liye abhi tak koi planning nahi hui hai.</div>`;
  }

  const myHTML = myUpdates.length ? myUpdates.map(j => `
      <div class="andon-job" style="margin-bottom:6px;">
        <div class="andon-job-name">${escapeHtml(j.machine)} — ${escapeHtml(j.jobName)}</div>
        <span class="status-pill ${j.action}">${statusLabel(j.action)}</span>
      </div>`).join('') : `<div class="empty-note" style="padding:6px 0;">Abhi tak koi update nahi diya</div>`;

  return `
    <div class="op-header-bar">
      <div>
        <div class="op-header-name">${escapeHtml(state.opName)}</div>
        <div class="op-header-shift">SHIFT ${state.opShift} · ${state.opDate}</div>
      </div>
      <button class="switch-link" id="opSwitchBtn">Switch</button>
    </div>
    ${allJobsHTML}
    <div class="my-updates-box">
      <div class="section-label" style="margin-top:0;">Mera Aaj ka Update</div>
      ${myHTML}
    </div>
  `;
}

/* ---------- Init ---------- */
render();

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW register fail', e));
  });
}
